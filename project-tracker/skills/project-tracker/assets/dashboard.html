<!-- dashboard-version: 1.7.4 --> <!-- x-release-please-version -->
<title>Project Tracker</title>
<link rel="stylesheet" href="core.css">

<div class="app">
  <header class="hdr">
    <h1>Project Tracker</h1>
    <div class="origin" id="origin"></div>
    <div class="pills" id="pills"></div>
    <div class="status">
      <div class="live" id="liveWrap"><span class="ldot" id="liveDot"></span><span id="liveText">Connecting…</span></div>
      <button class="obtn" id="refreshBtn" type="button" title="Refresh from Notion">Refresh</button>
      <a class="obtn" id="notionLink" href="#" target="_blank" rel="noopener" hidden>Notion ↗</a>
    </div>
  </header>

  <div class="grid">
    <div class="main">
      <section id="tlS" aria-label="Timeline">
        <div class="sec-h"><h2>Timeline</h2><div class="info" id="info"></div><span class="sp"></span><button class="btn" id="todayBtn" type="button">Today</button><div class="seg" id="range"></div></div>
        <div class="tlc"><div class="tl-scroll" id="tlScroll"></div></div>
      </section>
      <section id="projS" aria-label="Projects">
        <div class="sec-h"><h2>Projects</h2><span class="n" id="projCount"></span></div>
        <div class="cards" id="cards"></div>
      </section>
    </div>
    <aside class="side">
      <section class="panel" id="moveP" aria-label="Your move">
        <div class="sec-h"><h2>Your move</h2><span class="n" id="moveCount"></span></div>
        <div id="moveList"></div>
      </section>
      <section class="panel" id="waitP" aria-label="Waiting on others">
        <div class="sec-h"><h2>Waiting on others</h2><span class="n" id="waitCount"></span></div>
        <div id="waitList"></div>
      </section>
      <details class="panel" id="doneP">
        <summary><h2 title="Finished in the last 7 days">Recently completed</h2><span class="n muted" id="doneCount"></span><svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg></summary>
        <div id="doneList"></div>
      </details>
    </aside>
  </div>
  <footer>
    <span>Read-only view of the Notion tracker: change things by telling Claude in chat</span>
    <span>Click a project, a bar or a row to open it · Esc closes</span>
  </footer>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Project" aria-hidden="true">
  <div class="dr-bar">
    <span class="ttl" id="drTitle"></span>
    <span id="drChat"></span>
    <a class="ext" id="drNotion" href="#" target="_blank" rel="noopener"><span class="long">Open in </span>Notion ↗</a>
    <button class="icon-btn" id="drWide" type="button" aria-label="Widen" aria-pressed="false" title="Widen to the page width"><svg class="ico w1" viewBox="0 0 16 16"><path d="M9.5 2.5h4v4M13.5 2.5 9 7M6.5 13.5h-4v-4M2.5 13.5 7 9"/></svg><svg class="ico w2" viewBox="0 0 16 16"><path d="M13 7H9V3M9 7l4.5-4.5M3 9h4v4M7 9l-4.5 4.5"/></svg></button>
    <button class="icon-btn" id="drPrev" type="button" aria-label="Previous project" title="Previous project (↑)"><svg class="ico" viewBox="0 0 16 16"><path d="M3.5 10 8 5.5 12.5 10"/></svg></button>
    <button class="icon-btn" id="drNext" type="button" aria-label="Next project" title="Next project (↓)"><svg class="ico" viewBox="0 0 16 16"><path d="M3.5 6 8 10.5 12.5 6"/></svg></button>
    <button class="icon-btn" id="drClose" type="button" aria-label="Close"><svg class="ico" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
  </div>
  <div class="dr-body" id="drBody"></div>
  <button class="to-top" id="drTop" type="button" aria-label="Back to top" title="Back to top"><svg class="ico" viewBox="0 0 16 16"><path d="M8 13V3.5M3.5 8 8 3.5 12.5 8"/></svg></button>
</aside>

<script src="core.js"></script>
<script>window.PT_ROOT = "__ROOT_PAGE__";</script>
<script src="app.js"></script>
