<!-- dashboard-version: 0.3.3 --> <!-- x-release-please-version -->
<title>Project Tracker</title>
<style>
  /* Look: the same family as Upwork Pulse (system type, teal accent, green-grey neutrals, 10px cards, header pills, rows with an inset mark, the drawer).
     Layout: a calm overview on one screen — pills with what is overdue or due soon, the timeline of everything, a card per project; on the right
     what needs me and whom I wait on. Anything clicked opens its project as a readable page sliding in from the right. */
  :root {
    --bg: #f5f6f5; --surface: #ffffff; --surface-2: #f0f2f1; --sunken: #e9ecea;
    --line: #e3e6e4; --line-2: #cdd2d0;
    --ink: #1a1e1f; --ink-2: #5b6462; --ink-3: #8d9593;
    --accent: #0f7f79; --accent-soft: #e2f2f0; --on-accent: #ffffff;
    --crit: #b83a2e; --crit-soft: #fbe9e6; --warn: #8a6c2c; --warn-soft: #f5eedf; --good: #2a8a55; --good-soft: #e3f2e9;
    --bar: #dde1df; --bar-ink: #2b3231; --hatch: #c2c8c5; --scrim: rgba(18, 22, 22, .28);
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111314; --surface: #171a1b; --surface-2: #1d2123; --sunken: #141718;
      --line: #262b2d; --line-2: #353b3e;
      --ink: #e4e7e6; --ink-2: #9ca4a2; --ink-3: #6d7674;
      --accent: #5ec6bc; --accent-soft: #17302e; --on-accent: #0c1817;
      --crit: #ec7b70; --crit-soft: #35191a; --warn: #b39a5c; --warn-soft: #2a2416; --good: #6cc592; --good-soft: #16281e;
      --bar: #2b3133; --bar-ink: #d9dedd; --hatch: #485052; --scrim: rgba(0, 0, 0, .5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111314; --surface: #171a1b; --surface-2: #1d2123; --sunken: #141718;
    --line: #262b2d; --line-2: #353b3e;
    --ink: #e4e7e6; --ink-2: #9ca4a2; --ink-3: #6d7674;
    --accent: #5ec6bc; --accent-soft: #17302e; --on-accent: #0c1817;
    --crit: #ec7b70; --crit-soft: #35191a; --warn: #b39a5c; --warn-soft: #2a2416; --good: #6cc592; --good-soft: #16281e;
    --bar: #2b3133; --bar-ink: #d9dedd; --hatch: #485052; --scrim: rgba(0, 0, 0, .5);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; } /* iOS would otherwise enlarge some text after layout and make lines overlap */
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .muted { color: var(--ink-3); }
  .crit { color: var(--crit); } .warn { color: var(--warn); } .good { color: var(--good); } .acc { color: var(--accent); }
  .ext { color: var(--accent); text-decoration: none; }
  .ext:hover { text-decoration: underline; }

  /* ---------- page ---------- */
  .app { max-width: 1440px; margin: 0 auto; padding-inline: 24px; padding-block: 24px 40px; }
  .hdr { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; margin-bottom: 18px; }
  .hdr h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .tabs { display: inline-flex; gap: 2px; padding: 2px; background: var(--surface-2); border-radius: 7px; }
  .tabs:empty { display: none; }
  .tabs button { border: 0; background: transparent; padding: 4px 11px; border-radius: 5px; color: var(--ink-2); cursor: pointer; font-size: 13px; white-space: nowrap; }
  .tabs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
  .hdr .sp { flex: 1; }
  .live { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-3); white-space: nowrap; }
  .ldot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); flex: none; }
  .ldot.on { background: var(--good); }
  .obtn { border: 1px solid var(--line); background: transparent; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 12.5px; color: var(--ink-2); text-decoration: none; white-space: nowrap; }
  .obtn:hover { color: var(--ink); border-color: var(--ink-3); }
  .icon-btn { border: 0; background: none; border-radius: 6px; width: 30px; height: 30px; display: grid; place-items: center; cursor: pointer; color: var(--ink-3); }
  .icon-btn:hover { color: var(--ink); background: var(--sunken); }
  .ico { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  /* the header pills: the counts that matter, at a glance (same as Upwork Pulse) */
  .pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pl { display: inline-flex; align-items: baseline; gap: 5px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; color: var(--ink-2); white-space: nowrap; cursor: pointer; font-family: inherit; }
  .pl b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
  .pl:hover { border-color: var(--ink-3); }
  .pl.crit { background: var(--crit-soft); border-color: transparent; color: var(--crit); } .pl.crit b { color: var(--crit); }
  .pl.warn { background: var(--warn-soft); border-color: transparent; color: var(--warn); } .pl.warn b { color: var(--warn); }
  .pl.crit:hover, .pl.warn:hover { border-color: currentColor; }
  .pl.good { background: var(--good-soft); border-color: transparent; color: var(--good); cursor: default; }
  .kbd-hint { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
  .hdr .live { margin-left: auto; }
  @media (max-width: 560px) { .kbd-hint { display: none; } }
  .icon-btn[disabled] { opacity: .35; cursor: default; background: none; }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; align-items: start; }
  .main > section + section { margin-top: 28px; }
  .side { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 28px; }
  .sec-h { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; margin: 0 0 12px; min-height: 30px; }
  .sec-h h2 { margin: 0; font-size: 15px; font-weight: 600; }
  .sec-h .n { color: var(--ink-3); font-size: 13.5px; }
  .sec-h .sp { flex: 1; }

  /* ---------- project cards ---------- */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
  .pc .crit { overflow-wrap: anywhere; }
  .pc { display: flex; flex-direction: column; gap: 14px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px 16px; cursor: pointer; transition: border-color .15s, box-shadow .15s; min-width: 0; }
  .pc:hover { border-color: var(--ink-3); }
  .pc-top { display: flex; align-items: flex-start; gap: 12px; }
  .pc-name { font-size: 16.5px; font-weight: 600; line-height: 1.3; letter-spacing: -.005em; overflow-wrap: anywhere; }
  .pc-who { font-size: 13px; color: var(--ink-3); margin-top: 2px; }
  .pill { margin-left: auto; flex: none; font-size: 12.5px; font-weight: 500; line-height: 1; padding: 5px 9px; border-radius: 99px; background: var(--sunken); color: var(--ink-2); white-space: nowrap; }
  .pill.crit { background: var(--crit-soft); color: var(--crit); } .pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.good { background: var(--good-soft); color: var(--good); }
  .pc-now { display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 2px 10px; }
  .lab { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; color: var(--ink-3); padding-top: 3px; }
  .lab.crit { color: var(--crit); }
  .pc-now .t { font-size: 14.5px; line-height: 1.4; }
  .pc-now .w { grid-column: 2; font-size: 13px; color: var(--ink-3); }
  .pc-now .w.crit { color: var(--crit); } .pc-now .w.warn { color: var(--warn); }
  .pc-foot { margin-top: auto; }
  .prog { display: flex; gap: 2px; height: 4px; }
  .prog i { flex: 1; border-radius: 2px; background: var(--bar); }
  .prog i.done, .prog i.doneLate { background: var(--good); opacity: .6; } .prog i.prog { background: var(--accent); } .prog i.late { background: var(--crit); }
  .prog i.paused { background: var(--hatch); } .prog i.nodate { background: transparent; box-shadow: inset 0 0 0 1px var(--line-2); }
  .pc-cap { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12.5px; color: var(--ink-3); margin-top: 8px; }
  .pc-cap .r { margin-left: auto; }

  /* ---------- timeline ---------- */
  .seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 7px; background: var(--surface-2); }
  .seg button { border: 0; background: transparent; border-radius: 5px; padding: 4px 11px; font-size: 13px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
  .btn { border: 0; background: none; border-radius: 6px; padding: 4px 10px; font-size: 13px; color: var(--ink-2); cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--sunken); color: var(--ink); }
  .info { position: relative; margin-left: -6px; }
  .info .icon-btn { width: 24px; height: 24px; }
  .info .ico { width: 15px; height: 15px; }
  .info .pop { position: absolute; left: 0; top: calc(100% + 6px); z-index: 20; width: 290px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.16); padding: 14px 16px; font-size: 13px; color: var(--ink-2); }
  .info .pop .lg { display: grid; grid-template-columns: 26px 1fr; gap: 7px 10px; align-items: center; margin-bottom: 10px; }
  .info .pop .sw { height: 10px; border-radius: 3px; }
  .tlc { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .tl-scroll { overflow: auto; overscroll-behavior-x: contain; cursor: grab; max-height: 60vh; }
  .tl-scroll.dragging { cursor: grabbing; user-select: none; }
  .tl { position: relative; }
  .tl-months { position: sticky; top: 0; z-index: 4; height: 32px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .tl-month { position: absolute; top: 0; height: 100%; padding: 8px 0 0 8px; border-left: 1px solid var(--line); font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
  .tl-grid { position: absolute; top: 32px; bottom: 0; border-left: 1px solid var(--line); pointer-events: none; }
  .tl-wk { position: absolute; top: 0; height: 100%; padding: 9px 0 0 4px; font-size: 11px; color: var(--ink-3); opacity: .8; white-space: nowrap; }
  .tl-grid.wk { border-left: 1px dashed var(--line-2); }
  .tl-grid.day { border-left: 1px dotted var(--line-2); opacity: .6; }
  .tl-grid.yr { border-left-color: color-mix(in srgb, var(--ink-3) 45%, transparent); }
  .tl-month.yr { color: var(--ink-2); font-weight: 600; }
  .tl-today { position: absolute; top: 32px; bottom: 0; width: 2px; background: var(--accent); opacity: .7; z-index: 1; pointer-events: none; }
  .tl-today-l { position: absolute; top: 8px; z-index: 5; font-size: 11.5px; font-weight: 600; color: var(--accent); background: var(--surface); padding: 0 4px; transform: translateX(-50%); pointer-events: none; }
  .tl-row { position: relative; border-bottom: 1px solid var(--line); }
  .tl-row:last-child { border-bottom: 0; }
  .tl-label { position: sticky; left: 0; z-index: 3; width: var(--lw); height: calc(100% + 1px); display: flex; align-items: flex-start; gap: 9px; padding: 13px 14px 0 18px; background: var(--surface); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  .tl-row:last-child .tl-label { border-bottom: 0; height: 100%; }
  .tl-label button { border: 0; background: none; padding: 0; text-align: left; font-weight: 500; font-size: 13.5px; line-height: 1.35; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .tl-label button:hover { color: var(--accent); }
  .tl-label .dot { margin-top: 6px; }
  .tl-b { position: absolute; height: 22px; border: 0; border-radius: 6px; padding: 0 8px; font-size: 12.5px; line-height: 22px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; background: var(--bar); color: var(--bar-ink); }
  .tl-b:hover { filter: brightness(.96); box-shadow: 0 0 0 2px var(--line-2); }
  .tl-b.prog { background: var(--accent); color: var(--on-accent); }
  .tl-b.late { background: var(--crit); color: var(--on-accent); }
  .tl-b.done, .tl-b.doneLate { background: var(--good-soft); color: var(--good); }
  .tl-b.paused { background: color-mix(in srgb, var(--bar) 55%, var(--surface)); color: var(--ink-3); }
  .tl-b.nodate { background: transparent; box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink-3); }
  .tl-fail { position: absolute; top: 13px; font-size: 13px; color: var(--crit); white-space: nowrap; }

  /* ---------- right column: lists ---------- */
  .panel { background: none; border: 0; padding: 0; }
  .panel > .sec-h { padding: 0; margin-bottom: 12px; }
  #moveList, #waitList, #doneList { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .gh { display: flex; align-items: baseline; gap: 8px; padding: 7px 16px; background: var(--surface-2); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
  .gh:first-child { border-top: 0; }
  .gh .n, .gh .r { text-transform: none; letter-spacing: 0; }
  .gh .n { font-weight: 400; color: var(--ink-3); }
  .gh .r { margin-left: auto; font-weight: 400; color: var(--ink-3); }
  .gh.crit { color: var(--crit); } .gh.warn { color: var(--warn); }
  .it { display: grid; grid-template-columns: 3px minmax(0, 1fr) auto; column-gap: 9px; width: 100%; border: 0; background: none; text-align: left; padding: 11px 16px 11px 10px; cursor: pointer; }
  .it + .it { border-top: 1px solid var(--line); }
  .it:hover { background: var(--surface-2); }
  .it .mk { border-radius: 2px; background: transparent; align-self: stretch; margin: 2px 0; }
  .it .mk.crit { background: var(--crit); } .it .mk.warn { background: var(--warn); }
  .it .t { font-size: 14.5px; font-weight: 500; line-height: 1.4; overflow-wrap: anywhere; }
  .it .s { font-size: 13px; color: var(--ink-3); margin-top: 1px; overflow-wrap: anywhere; }
  .it .m { font-size: 13px; color: var(--ink-3); white-space: nowrap; padding-top: 2px; }
  .it .m.crit { color: var(--crit); } .it .m.warn { color: var(--warn); }
  .empty { padding: 12px 16px; color: var(--ink-3); font-size: 13.5px; }
  .err { margin: 10px 12px; padding: 10px 12px; border-radius: 6px; color: var(--crit); background: var(--crit-soft); font-size: 13px; overflow-wrap: anywhere; }
  details.panel > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 0; min-height: 30px; }
  details.panel[open] > summary { margin-bottom: 12px; }
  details.panel > summary::-webkit-details-marker { display: none; }
  details.panel > summary h2 { margin: 0; font-size: 15px; font-weight: 600; }
  details.panel > summary .chev { margin-left: auto; transition: transform .15s; }
  details.panel[open] > summary .chev { transform: rotate(90deg); }
  .chev { width: 14px; height: 14px; stroke: var(--ink-3); fill: none; stroke-width: 1.8; flex: none; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bar); flex: none; display: inline-block; }
  .dot.crit { background: var(--crit); } .dot.warn { background: var(--warn); } .dot.acc { background: var(--accent); } .dot.good { background: var(--good); }
  .dot.ring { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
  .dot.paused { background: var(--hatch); }
  .skel { height: 12px; border-radius: 4px; background: var(--sunken); }
  .skel + .skel { margin-top: 8px; }

  /* ---------- the project page, sliding in from the right ---------- */
  .scrim { position: fixed; inset: 0; z-index: 40; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 41; width: min(680px, 100vw); background: var(--surface); box-shadow: -20px 0 48px rgba(0, 0, 0, .14); display: flex; flex-direction: column; transform: translateX(104%); transition: transform .24s cubic-bezier(.2, .7, .2, 1); visibility: hidden; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .drawer.on { transform: none; visibility: visible; }
  @media (prefers-reduced-motion: reduce) { .drawer, .scrim, .chev { transition: none; } }
  .dr-bar { display: flex; align-items: center; gap: 8px; padding: 12px 16px 12px 20px; border-bottom: 1px solid var(--line); flex: none; }
  .dr-bar .ttl { flex: 1; min-width: 0; font-size: 13px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dr-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; }
  .dr-head { padding: 26px 36px 24px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
  .dr-who { font-size: 13.5px; color: var(--ink-3); }
  .dr-h1 { display: flex; align-items: flex-start; gap: 12px; margin: 4px 0 0; }
  .dr-h1 h1 { margin: 0; font-size: 26px; line-height: 1.2; font-weight: 600; letter-spacing: -.015em; text-wrap: balance; }
  .dr-h1 .pill { margin-top: 6px; }
  .dr-lede { margin: 12px 0 0; font-size: 15.5px; line-height: 1.55; color: var(--ink-2); max-width: 64ch; }
  .dr-in { padding: 4px 36px 56px; }
  .dr-note { margin-top: 20px; padding: 13px 16px 14px; border-radius: 10px; background: var(--accent-soft); border: 1px solid var(--line); border-color: color-mix(in srgb, var(--accent) 30%, transparent); font-size: 14px; line-height: 1.5; color: var(--ink); }
  .dr-note .nh { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; font-size: 12.5px; font-weight: 600; color: var(--accent); }
  .dr-note .nh .ico { width: 15px; height: 15px; }
  .dr-note .nh + div ~ div { margin-top: 4px; }
  .focus { margin-top: 20px; border: 1px solid var(--line); border-radius: 10px; }
  .fr { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 12px; padding: 13px 16px; align-items: start; }
  .fr + .fr { border-top: 1px solid var(--line); }
  .fl { justify-self: start; font-size: 12px; font-weight: 600; line-height: 1; padding: 5px 8px; border-radius: 6px; background: var(--sunken); color: var(--ink-2); margin-top: 1px; }
  .fl.now { background: var(--accent-soft); color: var(--accent); } .fl.crit { background: var(--crit-soft); color: var(--crit); }
  .fr .go { border: 0; background: none; padding: 0; text-align: left; cursor: pointer; font-size: 15px; font-weight: 500; line-height: 1.4; }
  .fr .go:hover { color: var(--accent); }
  .fr .w { font-size: 13px; color: var(--ink-3); margin-top: 1px; }
  .fr .w.crit { color: var(--crit); } .fr .w.warn { color: var(--warn); }
  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
  .stat { border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px 12px; min-width: 0; }
  .stat .k { font-size: 12.5px; color: var(--ink-3); display: flex; justify-content: space-between; gap: 6px; }
  .stat.go { text-align: left; background: none; cursor: pointer; font: inherit; color: inherit; width: 100%; }
  .stat.go:hover { border-color: var(--line-2); }
  .stat.go:hover .arr { color: var(--accent); }
  .stat .arr { color: var(--ink-3); }
  .stat .v { font-size: 17px; font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dr-links { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-top: 14px; font-size: 13.5px; }
  .dsec { margin-top: 32px; }
  .dsec-h { display: flex; align-items: center; gap: 9px; width: 100%; margin-bottom: 10px; padding: 4px 4px 4px 0; border: 0; background: none; text-align: left; cursor: pointer; color: var(--ink-2); border-radius: 8px; }
  .dsec-h:hover h3 { color: var(--accent); }
  .dsec-h > .chev { margin-left: 8px; transform: rotate(90deg); transition: transform .15s; }
  .dsec.folded .dsec-h > .chev { transform: none; }
  .dsec.folded .dsec-h { margin-bottom: 0; }
  .dsec-h .ico { width: 17px; height: 17px; }
  .dsec-h h3 { margin: 0; font-size: 17px; font-weight: 600; color: var(--ink); }
  .dsec-h .cnt { font-size: 12.5px; font-weight: 600; line-height: 1; padding: 4px 7px; border-radius: 99px; background: var(--sunken); color: var(--ink-2); }
  .dsec-h .r { margin-left: auto; font-size: 13px; }
  .dsec-h .r + .chev { margin-left: 8px; }
  .dsec-h .cnt + .chev, .dsec-h h3 + .chev { margin-left: auto; }
